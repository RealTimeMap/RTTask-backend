basePath: /
definitions:
  auth.Tokens:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      type:
        type: string
    type: object
  dto.CompanyPaginationResponse:
    properties:
      hasNext:
        type: boolean
      hasPrev:
        type: boolean
      items:
        items:
          $ref: '#/definitions/dto.CompanyResponse'
        type: array
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  dto.CompanyResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      logo:
        $ref: '#/definitions/dto.FileResponse'
      name:
        type: string
    type: object
  dto.FileResponse:
    properties:
      id:
        type: string
      mimeType:
        type: string
      name:
        type: string
      size:
        type: integer
      url:
        type: string
    type: object
  dto.GroupedTasksByStatusResponse:
    properties:
      groups:
        items:
          $ref: '#/definitions/dto.TaskStatusGroupResponse'
        type: array
      totalCount:
        type: integer
    type: object
  dto.InvitePaginationResponse:
    properties:
      hasNext:
        type: boolean
      hasPrev:
        type: boolean
      items:
        items:
          $ref: '#/definitions/dto.InviteResponse'
        type: array
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  dto.InviteResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      roles:
        items:
          type: string
        type: array
      token:
        type: string
    type: object
  dto.PermissionGroupDTO:
    properties:
      group:
        type: string
      permissions:
        items:
          $ref: '#/definitions/dto.PermissionResponse'
        type: array
    type: object
  dto.PermissionResponse:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  dto.RoleResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  dto.TaskPaginationResponse:
    properties:
      hasNext:
        type: boolean
      hasPrev:
        type: boolean
      items:
        items:
          $ref: '#/definitions/dto.TaskResponse'
        type: array
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  dto.TaskResponse:
    properties:
      company:
        $ref: '#/definitions/dto.CompanyResponse'
      completedAt:
        type: string
      createdAt:
        type: string
      creator:
        $ref: '#/definitions/dto.UserResponse'
      deadlineAt:
        type: string
      description:
        type: string
      executor:
        $ref: '#/definitions/dto.UserResponse'
      files:
        items:
          $ref: '#/definitions/dto.FileResponse'
        type: array
      id:
        type: integer
      priority:
        type: integer
      startAt:
        type: string
      status:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  dto.TaskStatusGroupResponse:
    properties:
      count:
        type: integer
      status:
        type: string
      tasks:
        items:
          $ref: '#/definitions/dto.TaskResponse'
        type: array
    type: object
  dto.TaskStatusUpdateRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      fullName:
        type: string
      id:
        type: integer
    type: object
  response.ProblemDetail:
    properties:
      detail:
        type: string
      instance:
        type: string
      meta:
        additionalProperties: true
        type: object
      status:
        type: integer
      title:
        type: string
      traceId:
        type: string
      type:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Task management system API documentation
  termsOfService: http://swagger.io/terms/
  title: RTTask API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Authenticate user with email and password
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: User password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated
          schema:
            $ref: '#/definitions/auth.Tokens'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      summary: User login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Register a new user with email, password, and invite link
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: User password
        in: formData
        name: password
        required: true
        type: string
      - description: User first name
        in: formData
        name: firstName
        required: true
        type: string
      - description: User last name
        in: formData
        name: lastName
        required: true
        type: string
      - description: Invite link token
        in: formData
        name: inviteLink
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Successfully registered
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "404":
          description: Invite link not found
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      summary: User registration
      tags:
      - auth
  /company:
    get:
      consumes:
      - application/json
      description: Get paginated list of all companies
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved companies
          schema:
            $ref: '#/definitions/dto.CompanyPaginationResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get companies list
      tags:
      - companies
    post:
      consumes:
      - multipart/form-data
      description: Create a new company with avatar image
      parameters:
      - description: Company name
        in: formData
        name: name
        required: true
        type: string
      - description: Company description
        in: formData
        name: description
        required: true
        type: string
      - description: Company avatar image
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created company
          schema:
            $ref: '#/definitions/dto.CompanyResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Create new company
      tags:
      - companies
  /invite:
    get:
      consumes:
      - application/json
      description: Get paginated list of all invite links created by the authenticated
        user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved invite links
          schema:
            $ref: '#/definitions/dto.InvitePaginationResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get all invite links
      tags:
      - invite
    post:
      consumes:
      - application/json
      description: Create a new invite link for user registration
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created invite link
          schema:
            $ref: '#/definitions/dto.InviteResponse'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Create invite link
      tags:
      - invite
  /role:
    post:
      consumes:
      - application/json
      description: Create a new role for users
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created role
          schema:
            $ref: '#/definitions/dto.RoleResponse'
        "400":
          description: Not valid data
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "403":
          description: Don't have permissions
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Create new role
      tags:
      - roles
  /role/permissions:
    get:
      description: Get all system permissions for role.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully registered
          schema:
            items:
              $ref: '#/definitions/dto.PermissionGroupDTO'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      summary: Systems permissions
      tags:
      - roles
  /task:
    get:
      consumes:
      - application/json
      description: Get paginated and filtered list of tasks for a company
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: pageSize
        type: integer
      - description: Company ID
        in: query
        name: companyId
        required: true
        type: integer
      - default: createdAt
        description: Sort field (createdAt, priority)
        in: query
        name: sortBy
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: sortOrder
        type: string
      - default: false
        description: Show completed tasks
        in: query
        name: showCompleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved tasks
          schema:
            $ref: '#/definitions/dto.TaskPaginationResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get tasks list
      tags:
      - tasks
    post:
      consumes:
      - multipart/form-data
      description: Create a new task with files attachments
      parameters:
      - description: Task title
        in: formData
        name: title
        required: true
        type: string
      - description: Task description
        in: formData
        name: description
        required: true
        type: string
      - description: Task priority
        in: formData
        name: priority
        required: true
        type: integer
      - description: Executor user ID
        in: formData
        name: executorId
        required: true
        type: integer
      - description: Company ID
        in: formData
        name: companyId
        required: true
        type: integer
      - description: Start date
        format: date-time
        in: formData
        name: startAt
        required: true
        type: string
      - description: Deadline date
        format: date-time
        in: formData
        name: deadlineAt
        required: true
        type: string
      - description: Task files
        in: formData
        name: files
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created task
          schema:
            $ref: '#/definitions/dto.TaskResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Create new task
      tags:
      - tasks
  /task/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an existing task by ID. Requires 'task:delete' permission.
        Only the task creator or users with delete permission can delete tasks
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted task
        "400":
          description: Invalid task ID
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "403":
          description: Forbidden - missing permission
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Delete task
      tags:
      - tasks
    patch:
      consumes:
      - multipart/form-data
      description: Update an existing task. Supports partial updates - only provided
        fields will be changed. Files can be added via 'files' field and removed via
        'deleteFilesIds' field.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Task title
        in: formData
        name: title
        type: string
      - description: Task description
        in: formData
        name: description
        type: string
      - description: Task priority (1-5)
        in: formData
        name: priority
        type: integer
      - description: Executor user ID
        in: formData
        name: executorId
        type: integer
      - description: Start date
        format: date-time
        in: formData
        name: startAt
        type: string
      - description: Deadline date
        format: date-time
        in: formData
        name: deadlineAt
        type: string
      - description: New files to attach
        in: formData
        name: files
        type: file
      - collectionFormat: csv
        description: IDs of files to delete
        in: formData
        items:
          type: string
        name: deleteFilesIds
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated task
          schema:
            $ref: '#/definitions/dto.TaskResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "403":
          description: Forbidden - missing permission
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Update task
      tags:
      - tasks
  /task/{id}/status:
    patch:
      consumes:
      - application/json
      description: 'Change the status of an existing task. Only the task executor
        or creator can change the status. Requires ''task:changeStatus'' permission.
        Valid statuses: "Новый", "В работе", "В доработке", "Выполнена", "Срочная"'
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TaskStatusUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated task status
          schema:
            $ref: '#/definitions/dto.TaskResponse'
        "400":
          description: Invalid request body or invalid status transition
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "403":
          description: Forbidden - not executor/creator or missing permission
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Update task status
      tags:
      - tasks
  /task/my:
    get:
      consumes:
      - application/json
      description: Get all tasks assigned to the authenticated user, grouped by status
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved grouped tasks
          schema:
            $ref: '#/definitions/dto.GroupedTasksByStatusResponse'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/response.ProblemDetail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get user tasks grouped by status
      tags:
      - tasks
schemes:
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
